name: Build My Bookshelf APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'index.html'
      - 'manifest.json'
      - 'service-worker.js'
      - 'bookshelf-background.jpg'
      - 'app-icon.svg'
      - 'splash.jpg'
      - 'Screenshot_20261010-191020_1.png'
      - 'Screenshot_20261010-191020_1.png'
      - 'maxresdefault-4-1024x576.jpg.webp'
      - 'android-custom/**'
      - '.github/workflows/build-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Prepare Capacitor Android app
        run: |
          mkdir -p www
          python3 -m pip install --quiet pillow cairosvg
          python3 - <<'PY'
          import cairosvg
          from PIL import Image
          import io
          src = Image.open("Screenshot_20261010-191020_1.png").convert("RGBA")
          src.thumbnail((512, 512), Image.Resampling.LANCZOS)
          canvas = Image.new("RGBA", (512, 512), (255,255,255,255))
          canvas.alpha_composite(src, ((512-src.width)//2, (512-src.height)//2))
          src = canvas
          for size in (192, 512):
              src.resize((size, size), Image.Resampling.LANCZOS).save("icon-" + str(size) + ".png", optimize=True)
          PY
          cp index.html manifest.json service-worker.js icon-192.png icon-512.png bookshelf-background.jpg Screenshot_20261010-191020_1.png Screenshot_20261010-191020_1.png maxresdefault-4-1024x576.jpg.webp www/
          cp app-icon.svg www/
          if [ -f splash.jpg ]; then cp splash.jpg www/; fi
          mkdir -p www/pdfjs
          cat > package.json <<'EOF'
          {
            "name": "my-bookshelf-android",
            "version": "1.0.0",
            "private": true,
            "description": "Android wrapper for My Bookshelf",
            "dependencies": {
              "@capacitor/android": "^7.4.3",
              "@capacitor/core": "^7.4.3",
              "pdfjs-dist": "3.11.174"
            },
            "devDependencies": {
              "@capacitor/cli": "^7.4.3"
            }
          }
          EOF
          npm install
          cp node_modules/pdfjs-dist/build/pdf.min.js node_modules/pdfjs-dist/build/pdf.worker.min.js www/pdfjs/
          cat > capacitor.config.json <<'EOF'
          {
            "appId": "com.promodeals.mybookshelf.updated",
            "appName": "My Bookshelf",
            "webDir": "www",
            "bundledWebRuntime": false,
            "server": {
              "androidScheme": "https"
            }
          }
          EOF
          npx cap add android
          npx cap sync android
          # Remove only the Android 12+ launch-screen icon; keep the home-screen app icon unchanged.
          python3 - <<'PY'
          import os, xml.etree.ElementTree as ET
          res = "android/app/src/main/res"
          ET.register_namespace("android", "http://schemas.android.com/apk/res/android")
          ns = "{http://schemas.android.com/apk/res/android}"
          manifest_path = "android/app/src/main/AndroidManifest.xml"
          manifest = ET.parse(manifest_path)
          app = manifest.getroot().find("application")
          activity = next((a for a in app.findall("activity") if a.get(ns+"name", "").endswith("MainActivity")), None)
          if activity is None:
              raise SystemExit("MainActivity not found")
          theme_ref = activity.get(ns+"theme") or app.get(ns+"theme")
          if not theme_ref or not theme_ref.startswith("@style/"):
              raise SystemExit("Could not identify Android app theme")
          theme_name = theme_ref.split("/", 1)[1]
          values_dir = os.path.join(res, "values-v31")
          os.makedirs(values_dir, exist_ok=True)
          styles_path = os.path.join(values_dir, "styles.xml")
          if os.path.exists(styles_path):
              styles = ET.parse(styles_path)
              root = styles.getroot()
          else:
              root = ET.Element("resources")
              styles = ET.ElementTree(root)
          style = next((s for s in root.findall("style") if s.get("name") == theme_name), None)
          if style is None:
              style = ET.SubElement(root, "style", {"name": theme_name})
          for name, value in (
              ("android:windowSplashScreenAnimatedIcon", "@drawable/splash_transparent"),
              ("android:windowSplashScreenBackground", "#1C1916"),
              ("android:windowSplashScreenAnimationDuration", "0"),
          ):
              item = next((i for i in style.findall("item") if i.get("name") == name), None)
              if item is None:
                  item = ET.SubElement(style, "item", {"name": name})
              item.text = value
          ET.indent(styles, space="    ")
          styles.write(styles_path, encoding="utf-8", xml_declaration=True)
          drawable_dir = os.path.join(res, "drawable")
          os.makedirs(drawable_dir, exist_ok=True)
          with open(os.path.join(drawable_dir, "splash_transparent.xml"), "w") as out:
              out.write('<?xml version="1.0" encoding="utf-8"?>\n<shape xmlns:android="http://schemas.android.com/apk/res/android" android:shape="rectangle"><solid android:color="#001C1916"/></shape>\n')
          print("Disabled the launch-screen logo only; launcher icon remains unchanged.")
          PY
          # Use the uploaded silver-haired anime PNG for Android launcher icons in every density.
          python3 - <<'PY'
          import cairosvg
          from PIL import Image
          import io, os, xml.etree.ElementTree as ET
          source = Image.open("Screenshot_20261010-191020_1.png").convert("RGBA")
          source.thumbnail((512, 512), Image.Resampling.LANCZOS)
          canvas = Image.new("RGBA", (512, 512), (255,255,255,255))
          canvas.alpha_composite(source, ((512-source.width)//2, (512-source.height)//2))
          source = canvas
          # Android 8+ prefers adaptive-icon XML over density PNGs. Replace those
          # adaptive resources too, using the uploaded image as the foreground.
          adaptive_dir = "android/app/src/main/res/mipmap-anydpi-v26"
          os.makedirs(adaptive_dir, exist_ok=True)
          foreground_dir = "android/app/src/main/res/drawable-nodpi"
          os.makedirs(foreground_dir, exist_ok=True)
          foreground = Image.new("RGBA", (432, 432), (255,255,255,0))
          icon = source.resize((320, 320), Image.Resampling.LANCZOS)
          foreground.alpha_composite(icon, ((432-icon.width)//2, (432-icon.height)//2))
          foreground.save(os.path.join(foreground_dir, "ic_launcher_foreground.png"), optimize=True)
          adaptive_xml = """<?xml version="1.0" encoding="utf-8"?>
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
              <background android:drawable="@color/ic_launcher_background"/>
              <foreground android:drawable="@drawable/ic_launcher_foreground"/>
          </adaptive-icon>
          """
          colors_dir = "android/app/src/main/res/values"
          os.makedirs(colors_dir, exist_ok=True)
          with open(os.path.join(colors_dir, "ic_launcher_background.xml"), "w") as out:
              out.write("""<?xml version="1.0" encoding="utf-8"?>
          <resources><color name="ic_launcher_background">#FFFFFF</color></resources>
          """)
          for name in ("ic_launcher", "ic_launcher_round"):
              with open(os.path.join(adaptive_dir, name + ".xml"), "w") as out:
                  out.write(adaptive_xml)
          sizes = {"mdpi":48, "hdpi":72, "xhdpi":96, "xxhdpi":144, "xxxhdpi":192}
          for density, size in sizes.items():
              folder = f"android/app/src/main/res/mipmap-{density}"
              os.makedirs(folder, exist_ok=True)
              image = source.resize((size, size), Image.Resampling.LANCZOS)
              image.save(os.path.join(folder, "ic_launcher.png"), optimize=True)
              image.save(os.path.join(folder, "ic_launcher_round.png"), optimize=True)
          manifest = "android/app/src/main/AndroidManifest.xml"
          ET.register_namespace("android", "http://schemas.android.com/apk/res/android")
          ns = "{http://schemas.android.com/apk/res/android}"
          tree = ET.parse(manifest)
          app = tree.getroot().find("application")
          if app is None:
              raise SystemExit("Android application element not found")
          app.set(ns + "icon", "@mipmap/ic_launcher")
          app.set(ns + "roundIcon", "@mipmap/ic_launcher_round")
          tree.write(manifest, encoding="utf-8", xml_declaration=True)
          print("Installed custom My Bookshelf launcher icons.")
          PY
          mkdir -p android/app/src/main/java/com/promodeals/mybookshelf/updated
          cp android-custom/FileSharePlugin.java android-custom/MainActivity.java android/app/src/main/java/com/promodeals/mybookshelf/updated/
          sed -i 's/^package com\.promodeals\.mybookshelf;/package com.promodeals.mybookshelf.updated;/' android/app/src/main/java/com/promodeals/mybookshelf/updated/FileSharePlugin.java android/app/src/main/java/com/promodeals/mybookshelf/updated/MainActivity.java
          python3 - <<'PY'
          import xml.etree.ElementTree as ET
          path = "android/app/src/main/AndroidManifest.xml"
          ET.register_namespace("android", "http://schemas.android.com/apk/res/android")
          ns = "{http://schemas.android.com/apk/res/android}"
          tree = ET.parse(path)
          root = tree.getroot()
          app = root.find("application")
          activity = None
          for item in app.findall("activity"):
              if item.get(ns + "name", "").endswith("MainActivity"):
                  activity = item
                  break
          if activity is None:
              raise SystemExit("MainActivity not found in generated Android manifest")
          activity.set(ns + "launchMode", "singleTask")
          for action_name in ("android.intent.action.SEND", "android.intent.action.SEND_MULTIPLE"):
              exists = any(
                  any(a.get(ns + "name") == action_name for a in filt.findall("action"))
                  for filt in activity.findall("intent-filter")
              )
              if exists:
                  continue
              filt = ET.SubElement(activity, "intent-filter")
              ET.SubElement(filt, "action", {ns + "name": action_name})
              ET.SubElement(filt, "category", {ns + "name": "android.intent.category.DEFAULT"})
              ET.SubElement(filt, "data", {ns + "mimeType": "*/*"})
          tree.write(path, encoding="utf-8", xml_declaration=True)
          PY

      - name: Build debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
          "$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -n1)/apksigner" verify --verbose app/build/outputs/apk/debug/app-debug.apk
          "$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -n1)/aapt" dump badging app/build/outputs/apk/debug/app-debug.apk | head -n 3

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: my-bookshelf-final-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

# Rebuild trigger: verified the APK workflow is present and runnable.
