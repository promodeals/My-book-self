name: Build My Bookshelf APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'index.html'
      - 'manifest.json'
      - 'service-worker.js'
      - 'android-custom/**'
      - '.github/workflows/build-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Prepare Capacitor Android app
        run: |
          mkdir -p www
          cp index.html manifest.json service-worker.js icon-192.png icon-512.png www/
          cat > package.json <<'EOF'
          {
            "name": "my-bookshelf-android",
            "version": "1.0.0",
            "private": true,
            "description": "Android wrapper for My Bookshelf",
            "dependencies": {
              "@capacitor/android": "^7.4.3",
              "@capacitor/core": "^7.4.3"
            },
            "devDependencies": {
              "@capacitor/cli": "^7.4.3"
            }
          }
          EOF
          npm install
          cat > capacitor.config.json <<'EOF'
          {
            "appId": "com.promodeals.mybookshelf",
            "appName": "My Bookshelf",
            "webDir": "www",
            "bundledWebRuntime": false,
            "server": {
              "androidScheme": "https"
            }
          }
          EOF
          npx cap add android
          npx cap sync android
          mkdir -p android/app/src/main/java/com/promodeals/mybookshelf
          cp android-custom/FileSharePlugin.java android-custom/MainActivity.java android/app/src/main/java/com/promodeals/mybookshelf/
          python3 - <<'PY'
          import xml.etree.ElementTree as ET
          path = "android/app/src/main/AndroidManifest.xml"
          ET.register_namespace("android", "http://schemas.android.com/apk/res/android")
          ns = "{http://schemas.android.com/apk/res/android}"
          tree = ET.parse(path)
          root = tree.getroot()
          app = root.find("application")
          activity = None
          for item in app.findall("activity"):
              if item.get(ns + "name", "").endswith("MainActivity"):
                  activity = item
                  break
          if activity is None:
              raise SystemExit("MainActivity not found in generated Android manifest")
          activity.set(ns + "launchMode", "singleTask")
          for action_name in ("android.intent.action.SEND", "android.intent.action.SEND_MULTIPLE"):
              exists = any(
                  any(a.get(ns + "name") == action_name for a in filt.findall("action"))
                  for filt in activity.findall("intent-filter")
              )
              if exists:
                  continue
              filt = ET.SubElement(activity, "intent-filter")
              ET.SubElement(filt, "action", {ns + "name": action_name})
              ET.SubElement(filt, "category", {ns + "name": "android.intent.category.DEFAULT"})
              ET.SubElement(filt, "data", {ns + "mimeType": "*/*"})
          tree.write(path, encoding="utf-8", xml_declaration=True)
          PY

      - name: Build debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: my-bookshelf-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
